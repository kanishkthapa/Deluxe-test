# Base settings for the Netlify site
[build]
  publish = "dist"
  command = "npm run build"

# Headers to solve MIME type issues
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript"

[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Content-Type = "text/javascript"
    
[[headers]]
  for = "/assets/*.ts"
  [headers.values]
    Content-Type = "text/javascript"
    
[[headers]]
  for = "/assets/*.tsx"
  [headers.values]
    Content-Type = "text/javascript"

# Optional /api proxy for local-style deploys without VITE_POLICY_API_URL.
# When VITE_POLICY_API_URL is set at build time, the app calls policy-api directly instead.
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-policy-api.example.com/:splat"
#   status = 200
#   force = true

# This makes sure all routes go to index.html for a SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200