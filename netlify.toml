# Base settings for the Netlify site
[build]
  publish = "dist"
  command = "npm run build"

# Headers to solve MIME type issues
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript"

[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Content-Type = "text/javascript"
    
[[headers]]
  for = "/assets/*.ts"
  [headers.values]
    Content-Type = "text/javascript"
    
[[headers]]
  for = "/assets/*.tsx"
  [headers.values]
    Content-Type = "text/javascript"

# /api/* is handled by netlify/edge-functions/api-proxy.ts (runtime proxy).
# Set POLICY_API_URL in Netlify env vars (ngrok or staging) — no redeploy needed to switch.
# Local dev: same var in .env, proxied by vite.config.ts.

# SPA fallback (edge function matches /api/* before this)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200